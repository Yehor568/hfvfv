<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Product Hunter{% endblock %}</title><link rel="stylesheet" href="/static/style.css"></head><body>
{% set p = request.url.path %}
<nav><b>Product Hunter</b>
<a href="/" class="{{ 'on' if p == '/' }}">Огляд</a>
<a href="/products" class="{{ 'on' if p.startswith('/products') }}">Товари</a>
<a href="/candidates" class="{{ 'on' if p.startswith('/candidates') }}">Кандидати</a>
<a href="/tests" class="{{ 'on' if p.startswith('/tests') }}">Тести</a>
<a href="/audience" class="{{ 'on' if p.startswith('/audience') }}">Аудиторія</a>
<a href="/settings" class="{{ 'on' if p.startswith('/settings') }}">Налаштування</a></nav>
<main>{% block content %}{% endblock %}</main></body></html>
